# This file has to live at  .github/workflows/build.yml  in the repository.
name: Build AutoSpear

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The files can be uploaded flat at the top of the repo. This puts them where Gradle expects them.
      - name: Arrange source files
        run: |
          mkdir -p src/main/java/arsonist/autospear src/main/resources
          if ls *.java >/dev/null 2>&1; then mv *.java src/main/java/arsonist/autospear/; fi
          if [ -f fabric.mod.json ]; then mv fabric.mod.json src/main/resources/; fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: auto-spear-v7
          path: build/libs/*.jar

      - name: Publish to Releases
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        with:
          tag_name: latest
          name: AutoSpear v7 (latest build)
          prerelease: true
          files: build/libs/*.jar
